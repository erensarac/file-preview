name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This job only reads the checkout. Without this block it would inherit the
# repository default, which on many repos hands a write-scoped token to every
# step — including `npm ci` running third-party install scripts.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Keyed on the Playwright version rather than the lockfile: the lockfile
      # changes whenever any dependency does, which would throw away a browser
      # that is still the right one. There are deliberately no restore-keys —
      # a near-miss would restore a browser the installed Playwright cannot
      # drive, which is worse than downloading.
      - name: Resolve the Playwright version
        id: playwright-version
        run: |
          echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}

      # The Playwright config builds the app itself before starting it, so a
      # separate build step here would only do the same work twice.
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # `--with-deps` also installs system libraries, and those live outside the
      # cached directory — so a cache hit still needs them, or the browser fails
      # to start on a runner that lacks one.
      - name: Install Chromium system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Covers the accessibility audit too — axe runs as part of the suite.
      - name: End-to-end tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
