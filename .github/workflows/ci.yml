name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This job only reads the checkout. Without this block it would inherit the
# repository default, which on many repos hands a write-scoped token to every
# step — including `npm ci` running third-party install scripts.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The Playwright config builds the app itself before starting it, so a
      # separate build step here would only do the same work twice.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Covers the accessibility audit too — axe runs as part of the suite.
      - name: End-to-end tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
