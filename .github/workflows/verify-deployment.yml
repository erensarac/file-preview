# The one check CI cannot make for itself.
#
# The rate limits live in Vercel's firewall, in front of the application. The
# Playwright suite drives a local server that the firewall never sees, so no
# spec can cover them — the rules could be deleted tomorrow and every test here
# would still be green.
#
# Two triggers, because the two checks here cost very different things.
#
# The upload check runs itself after every production deployment. It was added
# after a release in which no Office file could be opened at all — the whole
# suite green, the platform answering 200, and nobody any the wiser until a
# real file was pushed at the real deployment by hand. A check that only runs
# when someone remembers to run it would not have caught that, and will not
# catch the next one.
#
# The rate-limit check stays on demand. It sends a few hundred requests at
# production on purpose, which is reasonable just after changing a firewall
# rule and unreasonable on every merge.
name: Verify deployment

on:
  # Not `push`. A merge to main is not a deployment: the build takes minutes,
  # and testing at merge time measures whatever was live before it — a mistake
  # made by hand several times before this was automated. `deployment_status`
  # fires when the platform says the deployment is actually up.
  deployment_status:

  workflow_dispatch:
    inputs:
      base_url:
        description: The deployment to check
        required: true
        default: https://file-preview.vercel.app
      upload_limit:
        description: Requests per minute allowed for uploads
        required: true
        default: "30"
      telemetry_limit:
        # The same number, because one rule covers both endpoints — the plan
        # allows a single custom rule, so the two share a counter.
        description: Requests per minute allowed for failure reports
        required: true
        default: "30"

permissions:
  contents: read

# A runner is a single source address, and that address is what the rules count
# against. Two runs at once would share one counter and read each other's
# refusals as their own. They queue rather than cancel: cancelling mid-burst
# leaves the window full, so the run that replaced it would start against a
# counter it did not fill.
#
# Only runs that will actually send traffic belong in that queue, and the
# distinction is not cosmetic. When every deployment event started entering one
# group, three Dependabot pull requests deploying at once queued behind the
# production check and evicted it — GitHub keeps a single pending run per
# group, so the newest arrival cancels the one waiting. The release that was
# meant to be verified was cancelled by a preview build of a version bump.
#
# So the group is keyed on whether this run will POST at production at all.
# Everything that will — a hand-run, or a successful production deployment —
# shares `-live` and waits its turn. Everything else takes a group of its own,
# where it runs immediately, prints what it saw, and evicts nothing.
concurrency:
  group: verify-deployment-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.deployment_status.environment, 'Production')) && 'live' || github.run_id }}
  cancel-in-progress: false

# The two jobs below both POST at the same origin, and one shared rule counts
# every POST from one address. Running them together would mean the upload
# check spending budget the rate-limit check is trying to measure, so they
# queue: `rate-limits` waits for `office-upload` to finish and for the window
# to have lapsed.

jobs:
  # Three assumptions have been resting on "it works locally" since they were
  # written, and each fails in a way a local run cannot reproduce: the traced
  # child-process file, the platform's willingness to spawn one, and the cost
  # of doing so on an instance that was not already warm. One real upload
  # answers all three.
  office-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Deliberately a step rather than a job-level `if`.
      #
      # It was a job-level `if` first, keyed on `deployment.ref == 'main'`, and
      # that condition never once matched: Vercel creates its deployments
      # against a commit rather than a branch name, so the check reported
      # "skipped" after every release for a week and looked exactly like a
      # check that had passed. A condition that is silently always false is
      # worse than no condition, because it also produces a green tick.
      #
      # So the decision is made in the open. Every deployment event now starts
      # this job, and the first thing it does is print what it was handed and
      # say whether that qualifies. The cost is a few seconds of runner time
      # per event — Vercel sends several per deployment, previews included —
      # and what it buys is that "not checked" can never again be mistaken for
      # "checked and fine".
      - name: Say what this event is, and whether it qualifies
        id: qualify
        env:
          EVENT_NAME: ${{ github.event_name }}
          STATE: ${{ github.event.deployment_status.state }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          {
            echo "event:       ${EVENT_NAME}"
            echo "state:       ${STATE:-(none)}"
            echo "environment: ${ENVIRONMENT:-(none)}"
            echo "ref:         ${DEPLOYMENT_REF:-(none)}"
            echo "url:         ${ENVIRONMENT_URL:-(none)}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          qualifies=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            qualifies=true
          elif [ "$STATE" = "success" ]; then
            # The environment is what separates the thing users are on from
            # the preview built for every pull request. Matched on a prefix
            # and without case, because it is the platform's string to write.
            case "$(printf '%s' "$ENVIRONMENT" | tr '[:upper:]' '[:lower:]')" in
              production*) qualifies=true ;;
            esac
          fi

          echo "checking:    ${qualifies}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "qualifies=${qualifies}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.qualify.outputs.qualifies == 'true'

      - uses: actions/setup-node@v4
        if: steps.qualify.outputs.qualifies == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.qualify.outputs.qualifies == 'true'

      - name: Resolve the Playwright version
        id: playwright-version
        if: steps.qualify.outputs.qualifies == 'true'
        run: |
          echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        id: browser-cache
        if: steps.qualify.outputs.qualifies == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}

      - name: Install Chromium
        if: >-
          steps.qualify.outputs.qualifies == 'true' &&
          steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: >-
          steps.qualify.outputs.qualifies == 'true' &&
          steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Open real files on the deployment
        if: steps.qualify.outputs.qualifies == 'true'
        env:
          # The production domain, not the URL the event carries.
          #
          # `deployment_status.environment_url` was the first choice, on the
          # reasoning that it names the exact build this run was woken for
          # rather than whatever the domain is serving a moment later. Good
          # reasoning, wrong address: that URL is per-deployment
          # (`file-preview-4suekym9g-sarac.vercel.app`) and sits behind the
          # platform's access protection, so it answers every request with a
          # login page. The first real run of this check spent eight minutes
          # timing out against one.
          #
          # The domain below is the one users are on, which is the thing this
          # check exists to defend. The build it serves is the one that was
          # just promoted; on the rare race where a newer deployment has
          # replaced it, checking the newer one is not a wrong answer.
          DEPLOYMENT_URL: >-
            ${{ inputs.base_url || 'https://file-preview.vercel.app' }}
        run: npx playwright test --config playwright.deployment.config.ts

      # The page's own state at the moment it failed. Without this the log says
      # an element was not found and nothing about what was there instead.
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: deployment-failure
          path: test-results/
          retention-days: 7

  rate-limits:
    needs: office-upload
    # Hand-run only. Two hundred and fifty requests at production is a
    # deliberate act, not a per-deployment cost.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The uploads above spent from the same per-address budget this job is
      # about to measure. Waiting out the window is what makes its first burst
      # start from zero rather than from wherever the other job left it.
      - name: Let the rate-limit window lapse
        run: sleep 70

      - uses: actions/checkout@v4

      - name: Rate limits
        # Through the environment rather than interpolated into the script.
        # `${{ }}` is substituted as text before bash ever sees the line, so a
        # dispatch input written as a shell fragment would run as one; read as
        # a variable it is only ever a value.
        env:
          BASE_URL: ${{ inputs.base_url }}
          UPLOAD_LIMIT: ${{ inputs.upload_limit }}
          TELEMETRY_LIMIT: ${{ inputs.telemetry_limit }}
        run: |
          scripts/verify-rate-limit.sh "$BASE_URL" "$UPLOAD_LIMIT" "$TELEMETRY_LIMIT"
