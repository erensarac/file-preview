# The one check CI cannot make for itself.
#
# The rate limits live in Vercel's firewall, in front of the application. The
# Playwright suite drives a local server that the firewall never sees, so no
# spec can cover them — the rules could be deleted tomorrow and every test here
# would still be green.
#
# This runs on demand rather than on push. It sends a few hundred requests at
# the real deployment on purpose, which is a reasonable thing to do just after
# changing a firewall rule and an unreasonable thing to do on every commit.
name: Verify deployment

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: The deployment to check
        required: true
        default: https://file-preview.vercel.app
      upload_limit:
        description: Requests per minute allowed for uploads
        required: true
        default: "30"
      telemetry_limit:
        # The same number, because one rule covers both endpoints — the plan
        # allows a single custom rule, so the two share a counter.
        description: Requests per minute allowed for failure reports
        required: true
        default: "30"

permissions:
  contents: read

# A runner is a single source address, and that address is what the rules count
# against. Two runs at once would share one counter and read each other's
# refusals as their own. They queue rather than cancel: cancelling mid-burst
# leaves the window full, so the run that replaced it would start against a
# counter it did not fill.
concurrency:
  group: verify-deployment
  cancel-in-progress: false

# The two jobs below both POST at the same origin, and one shared rule counts
# every POST from one address. Running them together would mean the upload
# check spending budget the rate-limit check is trying to measure, so they
# queue: `rate-limits` waits for `office-upload` to finish and for the window
# to have lapsed.

jobs:
  # Three assumptions have been resting on "it works locally" since they were
  # written, and each fails in a way a local run cannot reproduce: the traced
  # child-process file, the platform's willingness to spawn one, and the cost
  # of doing so on an instance that was not already warm. One real upload
  # answers all three.
  office-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve the Playwright version
        id: playwright-version
        run: |
          echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Upload an Excel file to the deployment
        env:
          DEPLOYMENT_URL: ${{ inputs.base_url }}
        run: npx playwright test --config playwright.deployment.config.ts

      # The page's own state at the moment it failed. Without this the log says
      # an element was not found and nothing about what was there instead.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployment-failure
          path: test-results/
          retention-days: 7

  rate-limits:
    needs: office-upload
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The uploads above spent from the same per-address budget this job is
      # about to measure. Waiting out the window is what makes its first burst
      # start from zero rather than from wherever the other job left it.
      - name: Let the rate-limit window lapse
        run: sleep 70

      - uses: actions/checkout@v4

      - name: Rate limits
        # Through the environment rather than interpolated into the script.
        # `${{ }}` is substituted as text before bash ever sees the line, so a
        # dispatch input written as a shell fragment would run as one; read as
        # a variable it is only ever a value.
        env:
          BASE_URL: ${{ inputs.base_url }}
          UPLOAD_LIMIT: ${{ inputs.upload_limit }}
          TELEMETRY_LIMIT: ${{ inputs.telemetry_limit }}
        run: |
          scripts/verify-rate-limit.sh "$BASE_URL" "$UPLOAD_LIMIT" "$TELEMETRY_LIMIT"
